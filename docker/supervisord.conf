# docker/supervisord.conf — 大龙虾进程守护配置 (完整版)
# 按白皮书 §5.6 的 priority 顺序: 10/20/30/40/50/60/70

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

# ── 1. 虚拟显示 (无依赖，最先启动)
[program:xvfb]
command=Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset
environment=DISPLAY=":99"
autostart=true
autorestart=true
priority=10
startsecs=2

# ── 2. VNC 服务 (依赖 xvfb)
[program:x11vnc]
command=x11vnc -display :99 -nopw -listen 127.0.0.1 -xkb -forever -shared
autostart=true
autorestart=true
priority=20
startsecs=3
# ⚠️ 必须在 xvfb 之后启动，通过 priority + startsecs 间接保证

# ── 3. 桌面环境 (依赖 xvfb)
[program:xfce4]
command=startxfce4
environment=DISPLAY=":99",HOME="/root",USER="root"
autostart=true
autorestart=false
priority=30

# ── 4. noVNC Web 代理
[program:novnc]
command=/opt/novnc/utils/novnc_proxy --vnc 127.0.0.1:5900 --listen 0.0.0.0:6080
autostart=true
autorestart=true
priority=40

# ── 5. Sing-box 路由 (向导配置后由 API 启动)
[program:singbox]
command=sing-box run -c /app/config/singbox.json
autostart=true
autorestart=true
priority=50
startsecs=3
environment=DISPLAY=":99"

# ── 6. FastAPI 控制面 (最后启动，确保配置文件就绪)
[program:uvicorn]
command=/opt/miniforge/bin/uvicorn backend.main:app --host 0.0.0.0 --port 8000 --workers 1
directory=/app
autostart=true
autorestart=true
priority=60
environment=DISPLAY=":99"
stdout_logfile=/var/log/supervisor/uvicorn.log
stderr_logfile=/var/log/supervisor/uvicorn_err.log

# ── 7. OpenClaw Gateway
[program:openclaw]
command=openclaw gateway --port 18789 --allow-unconfigured
directory=/app/openclaw-home
autostart=false
autorestart=true
priority=70
environment=OPENCLAW_HOME="/app/openclaw-home",OPENCLAW_CONFIG_PATH="/app/config/openclaw.json",DISPLAY=":99",GITHUB_TOKEN="%(ENV_GITHUB_TOKEN)s",CLAWHUB_TOKEN="%(ENV_CLAWHUB_TOKEN)s"
stdout_logfile=/var/log/supervisor/openclaw.log
stderr_logfile=/var/log/supervisor/openclaw_err.log
