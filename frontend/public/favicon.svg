<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 大龙虾 Logo -->
  <defs>
    <linearGradient id="body-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c92a2a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 身体 -->
  <ellipse cx="50" cy="55" rx="30" ry="25" fill="url(#body-gradient)"/>

  <!-- 头部 -->
  <circle cx="50" cy="35" r="20" fill="url(#body-gradient)"/>

  <!-- 眼睛 -->
  <circle cx="42" cy="30" r="5" fill="white"/>
  <circle cx="58" cy="30" r="5" fill="white"/>
  <circle cx="42" cy="30" r="2" fill="black"/>
  <circle cx="58" cy="30" r="2" fill="black"/>

  <!-- 钳子 -->
  <path d="M25 50 Q10 40 5 55 Q10 70 25 60" fill="url(#body-gradient)" stroke="#c92a2a" stroke-width="2"/>
  <path d="M75 50 Q90 40 95 55 Q90 70 75 60" fill="url(#body-gradient)" stroke="#c92a2a" stroke-width="2"/>

  <!-- 触须 -->
  <path d="M35 18 Q30 5 20 10" fill="none" stroke="#c92a2a" stroke-width="3" stroke-linecap="round"/>
  <path d="M65 18 Q70 5 80 10" fill="none" stroke="#c92a2a" stroke-width="3" stroke-linecap="round"/>

  <!-- 腿 -->
  <path d="M30 75 Q20 85 15 80" fill="none" stroke="#c92a2a" stroke-width="3" stroke-linecap="round"/>
  <path d="M40 78 Q35 90 30 88" fill="none" stroke="#c92a2a" stroke-width="3" stroke-linecap="round"/>
  <path d="M60 78 Q65 90 70 88" fill="none" stroke="#c92a2a" stroke-width="3" stroke-linecap="round"/>
  <path d="M70 75 Q80 85 85 80" fill="none" stroke="#c92a2a" stroke-width="3" stroke-linecap="round"/>
</svg>